<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f58a3b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="かごメモ">
  <title>買い物かごメモ</title>
  <link rel="manifest" href="manifest.webmanifest?v=10">
  <link rel="icon" href="icon.svg?v=10" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=10">
  <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">今日のお買い物</p>
        <h1>買い物かごメモ</h1>
      </div>
      <button class="text-button" id="resetButton" type="button">今日の分を消す</button>
    </header>

    <section class="summary-card" aria-label="買い物の合計">
      <div class="budget-row">
        <label for="budgetInput">今日の予算</label>
        <div class="money-input"><input id="budgetInput" inputmode="numeric" value="2667" aria-label="今日の予算"><span>円</span></div>
      </div>
      <div class="remaining-block" id="remainingBlock">
        <span id="remainingLabel">あと使える</span>
        <strong><span id="remainingAmount">2,667</span><small>円</small></strong>
      </div>
      <div class="summary-grid">
        <div><span>かご合計</span><strong><span id="subtotalAmount">0</span>円</strong></div>
        <div><span>割引</span><strong>−<span id="discountAmount">0</span>円</strong></div>
        <div class="payment"><span>支払予定</span><strong><span id="paymentAmount">0</span>円</strong></div>
      </div>
      <div class="store-breakdown">
        <span>スーパー <b><span id="supermarketPayment">0</span>円</b></span>
        <span id="drugstoreBreakdown" hidden>ドラッグストア <b><span id="drugstorePayment">0</span>円</b></span>
      </div>
    </section>

    <section class="store-card">
      <div class="store-title"><span>今いるお店</span><small id="storeHint">いつもはスーパーだけで大丈夫</small></div>
      <div class="store-tabs">
        <button type="button" class="active" data-store="supermarket">スーパー</button>
        <button type="button" data-store="drugstore" id="drugstoreTab" hidden>ドラッグストア</button>
      </div>
      <button type="button" class="enable-drugstore" id="enableDrugstore">＋ ドラッグストアも使う</button>
    </section>

    <section class="coupon-card">
      <div class="discount-row">
        <label for="discountInput"><b><span id="discountStoreLabel">スーパー</span>の割引・ポイント</b><small>このお店で使う金額</small></label>
        <div class="discount-input"><input id="discountInput" inputmode="numeric" value="0" aria-label="割引・ポイントの金額"><span>円</span></div>
      </div>
    </section>

    <section class="must-buy-card">
      <div class="section-heading must-buy-heading">
        <div><p>買い忘れ防止</p><h2>今日ぜったい買う</h2></div>
        <span id="mustBuyCount">残り0</span>
      </div>
      <form id="mustBuyForm">
        <input id="mustBuyInput" autocomplete="off" placeholder="例：食器用洗剤" aria-label="ぜったい買うもの">
        <button type="submit">追加</button>
      </form>
      <p class="must-buy-empty" id="mustBuyEmpty">思いついたら、ここへ先に置いておける。</p>
      <ul id="mustBuyList" aria-live="polite"></ul>
      <button type="button" class="clear-checked-button" id="clearCheckedButton" hidden>チェック済みを片づける</button>
    </section>

    <section class="entry-card">
      <h2><span id="entryStoreLabel">スーパー</span>の商品を追加</h2>
      <form id="itemForm">
        <label>商品名<input id="itemName" autocomplete="off" placeholder="例：ごま油"></label>
        <label>1個の値段<input id="itemPrice" inputmode="numeric" placeholder="例：50"><span class="yen-mark">円</span></label>
        <label>個数<input id="itemQuantity" inputmode="numeric" value="1" aria-label="買う個数"><span class="piece-mark">個</span></label>
        <button class="primary-button" type="submit">かごに追加</button>
      </form>
    </section>

    <section class="items-section">
      <div class="section-heading">
        <h2>かごの中</h2>
        <span id="itemCount">0点</span>
      </div>
      <p class="empty-message" id="emptyMessage">まだ商品は入っていないぞ。</p>
      <ul id="itemList" aria-live="polite"></ul>
    </section>

    <p class="save-note">入力した内容は、このiPhoneに自動で残る。</p>
  </main>

  <dialog id="editDialog">
    <form method="dialog" id="editForm">
      <h2>商品を直す</h2>
      <label>商品名<input id="editName" autocomplete="off"></label>
      <label>1個の値段<input id="editPrice" inputmode="numeric"><span class="yen-mark">円</span></label>
      <label>個数<input id="editQuantity" inputmode="numeric"><span class="piece-mark">個</span></label>
      <label>お店<select id="editStore"><option value="supermarket">スーパー</option><option value="drugstore">ドラッグストア</option></select></label>
      <div class="dialog-actions">
        <button value="cancel" class="secondary-button">やめる</button>
        <button value="save" class="primary-button" id="saveEditButton">直す</button>
      </div>
      <button type="button" class="dialog-delete-button" id="deleteEditButton">この商品を削除</button>
    </form>
  </dialog>

  <script src="app.js?v=10" defer></script>
</body>
</html>
